<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustPlay - Player de Música Offline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
        </svg>
        <h1>JustPlay</h1>
        <span>OFFLINE</span>
      </div>

      <ul class="nav-menu">
        <li class="nav-item active" data-target="recent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Biblioteca / Recentes
        </li>
        <li class="nav-item" data-target="playlists">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          Playlists & Ranking
        </li>
      </ul>
    </aside>

    <!-- Main Dynamic Views -->
    <main id="main-view">
      <div id="view-recent-container" style="display: flex; flex-direction: column; width: 100%; height: 100%;"></div>
      <div id="view-playlists-container" style="display: none; flex-direction: column; width: 100%; height: 100%;"></div>

      <!-- Right Side Drawers -->
      <div id="queue-drawer-container"></div>
      <div id="lyrics-drawer-container"></div>
    </main>
  </div>

  <!-- Bottom Player Bar -->
  <footer id="player-bar"></footer>

  <!-- Generic Prompt Modal -->
  <div class="modal-overlay" id="generic-modal">
    <div class="modal-card">
      <h3 id="modal-title">Título do Modal</h3>
      <input type="text" class="modal-input" id="modal-input" placeholder="Digite aqui...">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-btn-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-btn-confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Add to Playlist Picker Modal -->
  <div class="modal-overlay" id="playlist-picker-modal">
    <div class="modal-card">
      <h3>Adicionar à Playlist</h3>
      <div class="playlists-list" id="playlist-picker-list" style="max-height: 240px; overflow-y: auto;"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="playlist-picker-close">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast-notification"></div>

  <!-- Scripts -->
  <script src="../audio/queue-manager.js"></script>
  <script src="../audio/audio-engine.js"></script>
  <script src="components/PlayerBar.js"></script>
  <script src="components/HomeRecentView.js"></script>
  <script src="components/PlaylistsRankView.js"></script>
  <script src="components/QueueView.js"></script>
  <script src="components/LyricsView.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
