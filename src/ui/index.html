<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustPlay - Player de Música Offline</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    window.addEventListener('error', (e) => {
      console.error('[UNCAUGHT ERROR]', e.message, 'at', e.filename, 'line', e.lineno, 'col', e.colno, e.error?.stack);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[UNHANDLED PROMISE REJECTION]', e.reason?.stack || e.reason);
    });
  </script>
</head>
<body>
  <!-- Custom Background Layers -->
  <div id="app-bg-layer"></div>
  <div id="app-bg-dimmer"></div>

  <div id="app-container">
    <!-- Top Global Header & Search Navigation -->
    <header id="top-header-container"></header>

    <!-- 3-Column Body Grid: Left Library Rail, Center Views, Right Artist/NowPlaying -->
    <div id="app-body-grid">
      <!-- Left Collapsed Library Rail (~72px) -->
      <aside id="sidebar-rail-container"></aside>

      <!-- Center Dynamic View Panel -->
      <main id="main-content-panel">
        <div id="view-recent-container" style="display: flex; flex-direction: column; width: 100%; height: 100%;"></div>
        <div id="view-playlists-container" style="display: none; flex-direction: column; width: 100%; height: 100%;"></div>

        <!-- Sliding Drawers Inside Center Panel -->
        <div id="queue-drawer-container"></div>
        <div id="lyrics-drawer-container"></div>
      </main>

      <!-- Right Insights / Now Playing Panel (~320px) -->
      <aside id="sidebar-right-container"></aside>
    </div>

    <!-- Bottom Player Bar (Trifurcated Controls) -->
    <footer id="player-bar"></footer>
  </div>

  <!-- Fullscreen Slide-Up Now Playing Overlay -->
  <div id="now-playing-container"></div>

  <!-- Settings Modal Container -->
  <div id="settings-modal-container"></div>

  <!-- Generic Prompt Modal -->
  <div class="modal-overlay" id="generic-modal">
    <div class="modal-card">
      <h3 id="modal-title">Título do Modal</h3>
      <input type="text" class="modal-input" id="modal-input" placeholder="Digite aqui...">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-btn-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-btn-confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Add to Playlist Picker Modal -->
  <div class="modal-overlay" id="playlist-picker-modal">
    <div class="modal-card">
      <h3>Adicionar à Playlist</h3>
      <div class="playlists-list" id="playlist-picker-list" style="max-height: 240px; overflow-y: auto;"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="playlist-picker-close">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast-notification"></div>

  <!-- Scripts -->
  <script src="../services/configStorage.js"></script>
  <script src="../services/playlistCoverService.js"></script>
  <script src="../audio/queue-manager.js"></script>
  <script src="../audio/audio-engine.js"></script>
  <script src="components/TopHeader.js"></script>
  <script src="components/LibraryRail.js"></script>
  <script src="components/SidebarRight.js"></script>
  <script src="components/TrackList.js"></script>
  <script src="components/PlayerBar.js"></script>
  <script src="components/HomeRecentView.js"></script>
  <script src="components/PlaylistsRankView.js"></script>
  <script src="components/QueueView.js"></script>
  <script src="components/LyricsView.js"></script>
  <script src="components/NowPlayingView.js"></script>
  <script src="components/SettingsModal.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
